name: Android AAB (Play Store)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ── Upload key ───────────────────────────────────────────────────────────
      # Play App Signing: Google holds the app signing key; we sign with the
      # upload key stored in RELEASE_KEYSTORE_BASE64 (PKCS12, alias "upload").
      # This repo is public, so build logs are public: never generate, print or
      # default a key here. No secret means no release build.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Restore upload keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_PASSWORD secrets are required."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"

      # Capacitor 8 needs Node 22+.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Build web (Vite)
        run: npm run build

      - name: Remove existing android folder
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # The android/ folder is deleted and regenerated above, which discards any
      # committed launcher icons — every previous build therefore shipped the
      # stock Capacitor icon. Regenerate them here, from assets/, so the branded
      # icon actually reaches the APK.
      - name: Generate app icons
        run: npx @capacitor/assets generate --android --assetPath assets

      # setup-android@v3 takes `packages`, not `api-level`/`build-tools` — those
      # were silently ignored, so it fell back to its default of `tools`, a
      # package Google has since removed from the SDK repository. That is what
      # started failing with "Failed to find package 'tools'".
      #
      # `packages: ''` installs cmdline-tools only; the Gradle Android plugin
      # then resolves the exact platform and build-tools it needs, which are
      # already declared in android/variables.gradle.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # Google Play requires new apps and updates to target API 36 (Android 16)
      # from 31 Aug 2026. The Capacitor 8 template already does; fail loudly if
      # that ever changes rather than ship something Play will reject.
      - name: Check target SDK
        run: |
          grep -E 'targetSdkVersion = 36' android/variables.gradle
          grep -E 'compileSdkVersion = 36' android/variables.gradle

      # Play rejects an upload whose versionCode is not higher than the last one.
      - name: Set version
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Ensure CAMERA permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || \
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"

      # The driver's login token lives in WebView storage; keep it out of
      # Android cloud/device backups.
      - name: Disable app backup
        run: sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml

      - name: Configure release signing
        run: |
          cat >> android/app/build.gradle << EOF

          android.signingConfigs {
            release {
              storeFile file("$RUNNER_TEMP/upload.p12")
              storeType "pkcs12"
              storePassword System.getenv("KEYSTORE_PASSWORD")
              keyAlias "upload"
              keyPassword System.getenv("KEY_PASSWORD")
            }
          }
          android.buildTypes.release.signingConfig android.signingConfigs.release
          EOF

      - name: Build release AAB + APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease

      # Prints only public facts: the upload certificate fingerprint (compare
      # with the one registered in Play Console) and the permissions requested.
      - name: Verify signature and permissions
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E 'Owner|SHA256'
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -E "^package|targetSdkVersion|uses-permission|application-label"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
